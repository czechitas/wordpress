zerops:
  - setup: base
    build:
      os: ubuntu
      base: php@8.3
      envVariables:
      prepareCommands:
        - curl -sSO https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
        - chmod +x wp-cli.phar
        - mv wp-cli.phar /usr/local/bin/wp
        - wp --allow-root --info
      buildCommands:
        - bash ./scripts/build.sh
      deployFiles:
        - ./config.txt
        - ./public
        - ./scripts
        - ./site.conf.tmpl
        - ./wp-config.php
        - ./wordpress 
    run:
      os: ubuntu
      base: php-nginx@8.3
      envVariables:
        HTTP_X_FORWARDED_PROTO: https
        WP_HOSTNAME: ${hostname}
        WP_DB_HOST: ${wpdb_hostname}
        WP_DB_PASSWORD: ${wpdb_password}
        WP_DB_USER: ${wpdb_user}
      prepareCommands:
        - apt-get update && apt-get install -y mariadb-client
        - curl -sSO https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
        - chmod +x wp-cli.phar
        - mv wp-cli.phar /usr/local/bin/wp
      initCommands:
        - sudo -E -u zerops -- bash ./scripts/init.sh
      siteConfigPath: site.conf.tmpl
      crontab:
        - command: "tar -czvf /mnt/wpstorage/backup-$hostname.tar.gz /var/www/public"
          timing: "0 1 * * *"
          workingDir: /var/www/

  - setup: wp1
    extends: base

  - setup: wp2
    extends: base

  - setup: wp3
    extends: base
