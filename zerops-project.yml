#yamlPreprocessor=on
project:
  name: wodpress
  description: This is a project for Wodpress installation for Czechitas Wodpress class
  corePackage: LIGHT

services:
  - hostname: wpstorage
    type: shared-storage
    mode: NON_HA
    priority: 10

  - hostname: wpdb
    type: mariadb@10.6
    mode: NON_HA
    priority: 10
   
  - hostname: wpapp
    type: php-nginx@8.3
    priority: 1
    buildFromGit: https://github.com/czechitas/wordpress@multisite
    enableSubdomainAccess: true
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 3
      minRam: 0.25
      maxRam: 10
      minDisk: 1
      maxDisk: 10
    minContainers: 1
    maxContainers: 1
    mount:
      - wpstorage
    envSecrets:
      CZECHITAS_PASSWORD: <@generateRandomString(<8>)>
      WP01_PASSWORD: <@generateRandomString(<8>)>
      WP02_PASSWORD: <@generateRandomString(<8>)>
      WP03_PASSWORD: <@generateRandomString(<8>)>
      WP04_PASSWORD: <@generateRandomString(<8>)>
      WP05_PASSWORD: <@generateRandomString(<8>)>
      WP06_PASSWORD: <@generateRandomString(<8>)>
      WP07_PASSWORD: <@generateRandomString(<8>)>
      WP08_PASSWORD: <@generateRandomString(<8>)>
      WP09_PASSWORD: <@generateRandomString(<8>)>
      WP10_PASSWORD: <@generateRandomString(<8>)>
      WP11_PASSWORD: <@generateRandomString(<8>)>
      WP12_PASSWORD: <@generateRandomString(<8>)>
      WP13_PASSWORD: <@generateRandomString(<8>)>
      WP14_PASSWORD: <@generateRandomString(<8>)>
      WP15_PASSWORD: <@generateRandomString(<8>)>
      WP16_PASSWORD: <@generateRandomString(<8>)>
      WP17_PASSWORD: <@generateRandomString(<8>)>
      WP18_PASSWORD: <@generateRandomString(<8>)>
      WP19_PASSWORD: <@generateRandomString(<8>)>
      WP20_PASSWORD: <@generateRandomString(<8>)>
      WP21_PASSWORD: <@generateRandomString(<8>)>
      WP22_PASSWORD: <@generateRandomString(<8>)>
      WP23_PASSWORD: <@generateRandomString(<8>)>
      WP24_PASSWORD: <@generateRandomString(<8>)>
      WP25_PASSWORD: <@generateRandomString(<8>)>
      WP26_PASSWORD: <@generateRandomString(<8>)>
      WP27_PASSWORD: <@generateRandomString(<8>)>
      WP28_PASSWORD: <@generateRandomString(<8>)>
      WP29_PASSWORD: <@generateRandomString(<8>)>
