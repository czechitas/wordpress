#yamlPreprocessor=on
project:
  name: wodpress
  description: This is a project for Wodpress installation for Czechitas Wodpress class
  corePackage: LIGHT

services:
  - hostname: wpstorage
    type: shared-storage
    mode: NON_HA
    priority: 10

  - hostname: wpdb
    type: mariadb@10.6
    mode: NON_HA
    priority: 10
   
  - hostname: wp1
    type: php-nginx@8.3
    priority: 1
    buildFromGit: https://github.com/czechitas/wordpress@multisite
    enableSubdomainAccess: true
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 3
      minRam: 0.25
      maxRam: 10
      minDisk: 1
      maxDisk: 10
    minContainers: 1
    maxContainers: 1
    mount:
      - wpstorage
    envSecrets:
      CZECHITAS_PASSWORD: xxxxxxxxxx
      ADMIN_PASSWORD: xxxxxxxxxx
    
      WP_AUTH_KEY: <@generateRandomString(<64>)>
      WP_AUTH_SALT: <@generateRandomString(<64>)>
      WP_LOGGED_IN_KEY: <@generateRandomString(<64>)>
      WP_LOGGED_IN_SALT: <@generateRandomString(<64>)>
      WP_NONCE_KEY: <@generateRandomString(<64>)>
      WP_NONCE_SALT: <@generateRandomString(<64>)>
      WP_SECURE_AUTH_KEY: <@generateRandomString(<64>)>
      WP_SECURE_AUTH_SALT: <@generateRandomString(<64>)>

  - hostname: wp2
    type: php-nginx@8.3
    priority: 1
